blueprint:
  name: Bambu Lab 3D Printer Monitor (v1.3.3)
  author: thinkjk
  homeassistant:
    min_version: 2024.6.0
  description: >
    Monitor your Bambu Lab 3D printer for print completion, failures, and other status changes.
    Sends notifications with camera snapshots and provides detailed print information.
  domain: automation
  source_url: https://github.com/thinkjk/bambu-printer-monitor/blob/master/bambu_printer_monitor.yaml
  input:
    printer_name:
      name: Printer Name
      description: Custom name for your printer (e.g., "Bambu X1 Carbon")
      default: "Bambu Printer"
      selector:
        text:
    print_status_entity:
      name: Print Status Entity
      description: The print status sensor (e.g., sensor.h2d_0948ab510700345_print_status)
      selector:
        entity:
          domain: sensor
          integration: bambu_lab
    print_progress_entity:
      name: Print Progress Entity  
      description: The print progress sensor (e.g., sensor.h2d_0948ab510700345_print_progress)
      selector:
        entity:
          domain: sensor
          integration: bambu_lab
    current_stage_entity:
      name: Current Stage Entity
      description: The current stage sensor (e.g., sensor.h2d_0948ab510700345_current_stage)
      selector:
        entity:
          domain: sensor
          integration: bambu_lab
    bed_temperature_entity:
      name: Bed Temperature Entity
      description: The bed temperature sensor (e.g., sensor.h2d_0948ab510700345_bed_temperature)
      selector:
        entity:
          domain: sensor
          integration: bambu_lab
    nozzle_temperature_entity:
      name: Nozzle Temperature Entity
      description: The active/current nozzle temperature sensor (e.g., sensor.x1c_nozzle_temperature)
      selector:
        entity:
          domain: sensor
          integration: bambu_lab
    nozzle_1_temperature_entity:
      name: Nozzle 1 Temperature Entity (Optional)
      description: First nozzle temperature for dual-nozzle printers (e.g., sensor.x1c_nozzle_1_temperature)
      default: ""
      selector:
        entity:
          domain: sensor
          integration: bambu_lab
    nozzle_2_temperature_entity:
      name: Nozzle 2 Temperature Entity (Optional)
      description: Second nozzle temperature for dual-nozzle printers (e.g., sensor.x1c_nozzle_2_temperature)
      default: ""
      selector:
        entity:
          domain: sensor
          integration: bambu_lab
    remaining_time_entity:
      name: Remaining Time Entity
      description: The remaining time sensor (e.g., sensor.h2d_0948ab510700345_remaining_time)
      selector:
        entity:
          domain: sensor
          integration: bambu_lab
    bed_target_temperature_entity:
      name: Bed Target Temperature Entity
      description: The bed target temperature sensor (e.g., sensor.h2d_0948ab510700345_bed_target_temperature)
      selector:
        entity:
          domain: sensor
          integration: bambu_lab
    task_name_entity:
      name: Task Name Entity
      description: The task/print name sensor (e.g., sensor.h2d_0948ab510700345_task_name)
      selector:
        entity:
          domain: sensor
          integration: bambu_lab
    end_time_entity:
      name: End Time Entity
      description: The estimated end time sensor (e.g., sensor.h2d_0948ab510700345_end_time)
      selector:
        entity:
          domain: sensor
          integration: bambu_lab
    camera_entity:
      name: Printer Camera
      description: The camera entity for your Bambu Lab printer
      selector:
        entity:
          domain: camera
    notify_device:
      name: Notification Device
      description: Device to send notifications to
      selector:
        device:
          integration: mobile_app
    notify_service:
      name: Notification Service (Optional)
      description: Alternative notification service (leave blank to use device)
      default: ""
      selector:
        text:
    enable_progress_updates:
      name: Enable Progress Updates
      description: Send notifications at 25%, 50%, 75%, 100% completion
      default: false
      selector:
        boolean:
    enable_persistent_notification:
      name: Enable Persistent Progress Notification
      description: Show a persistent, auto-updating notification with live progress bar throughout the print
      default: false
      selector:
        boolean:
    enable_start_notification:
      name: Enable Print Start Notification
      description: Send a notification when a print starts
      default: true
      selector:
        boolean:
    enable_ams_alerts:
      name: Enable AMS Alerts
      description: Send alerts for AMS filament changes, errors, etc.
      default: true
      selector:
        boolean:
    ams_1_entity:
      name: AMS 1 Device (Optional)
      description: First AMS device for monitoring filament levels
      default: ""
      selector:
        device:
          integration: bambu_lab
    ams_2_entity:
      name: AMS 2 Device (Optional)
      description: Second AMS device for monitoring filament levels
      default: ""
      selector:
        device:
          integration: bambu_lab
    ams_3_entity:
      name: AMS 3 Device (Optional)
      description: Third AMS device for monitoring filament levels
      default: ""
      selector:
        device:
          integration: bambu_lab
    ams_4_entity:
      name: AMS 4 Device (Optional)
      description: Fourth AMS device for monitoring filament levels
      default: ""
      selector:
        device:
          integration: bambu_lab
    ams_ht_entity:
      name: AMS HT Device (Optional)
      description: AMS HT device for high-temperature filaments
      default: ""
      selector:
        device:
          integration: bambu_lab
    include_live_view:
      name: Include Live View Link
      description: Add a link to the live camera view in notifications
      default: true
      selector:
        boolean:
    quiet_hours_start:
      name: Quiet Hours Start
      description: Start time for quiet hours (no notifications)
      default: "22:00:00"
      selector:
        time:
    quiet_hours_end:
      name: Quiet Hours End
      description: End time for quiet hours
      default: "07:00:00"
      selector:
        time:
    home_assistant_url:
      name: Home Assistant URL
      description: Your Home Assistant URL for notification actions (e.g., http://homeassistant.local:8123)
      default: "http://homeassistant.local:8123"
      selector:
        text:
    printer_dashboard_path:
      name: Printer Dashboard Path
      description: Path to your printer dashboard (e.g., /lovelace/3d-printer)
      default: "/lovelace/dashboard"
      selector:
        text:

mode: queued
max_exceeded: silent
max: 5

variables:
  print_status: !input print_status_entity
  print_progress: !input print_progress_entity
  current_stage: !input current_stage_entity
  bed_temperature: !input bed_temperature_entity
  nozzle_temperature: !input nozzle_temperature_entity
  nozzle_1_temperature: !input nozzle_1_temperature_entity
  nozzle_2_temperature: !input nozzle_2_temperature_entity
  remaining_time: !input remaining_time_entity
  bed_target_temperature: !input bed_target_temperature_entity
  task_name: !input task_name_entity
  end_time: !input end_time_entity
  camera: !input camera_entity
  notify_device: !input notify_device
  notify_service: !input notify_service
  enable_progress: !input enable_progress_updates
  enable_persistent: !input enable_persistent_notification
  enable_start_notification: !input enable_start_notification
  enable_ams_alerts: !input enable_ams_alerts
  include_live_view: !input include_live_view
  quiet_start: !input quiet_hours_start
  quiet_end: !input quiet_hours_end
  home_assistant_url: !input home_assistant_url
  dashboard_path: !input printer_dashboard_path
  
  # Use custom printer name from input
  printer_name: !input printer_name
  
  # Build nozzle temperature display (supports dual nozzles)
  nozzle_temps: >
    {% set has_n1 = nozzle_1_temperature != '' and states(nozzle_1_temperature) not in ['unknown', 'unavailable', ''] %}
    {% set has_n2 = nozzle_2_temperature != '' and states(nozzle_2_temperature) not in ['unknown', 'unavailable', ''] %}
    {% if has_n1 and has_n2 %}
      Nozzle: {{ states(nozzle_temperature) | default('unknown') }}°C (N1: {{ states(nozzle_1_temperature) }}°C, N2: {{ states(nozzle_2_temperature) }}°C)
    {% elif has_n1 or has_n2 %}
      Nozzle: {{ states(nozzle_temperature) | default('unknown') }}°C
    {% else %}
      Nozzle: {{ states(nozzle_temperature) | default('unknown') }}°C
    {% endif %}
  
  # Build live view URL for camera
  live_view_url: >
    {{ home_assistant_url }}/api/camera_proxy/{{ camera }}
  
  # Get print task name
  print_name: >
    {% set name = states(task_name) | default('') %}
    {{ name if name not in ['unknown', 'unavailable', ''] else 'Print Job' }}

  # Get estimated finish time from end_time entity
  finish_time: >
    {% set end = states(end_time) | default('unknown') %}
    {% if end not in ['unknown', 'unavailable', ''] %}
      {{ as_timestamp(end) | timestamp_custom('%-I:%M %p') }}
    {% else %}
      unknown
    {% endif %}

  # Format remaining time as hours and minutes
  remaining_time_formatted: >
    {% set mins = states(remaining_time) | int(0) %}
    {% set hours = mins // 60 %}
    {% set minutes = mins % 60 %}
    {% if hours > 0 %}{{ hours }}h {{ minutes }}m{% else %}{{ minutes }}m{% endif %}

  # Check if we're in quiet hours
  is_quiet_time: >
    {% set now_time = now().strftime('%H:%M:%S') %}
    {% if quiet_start <= quiet_end %}
      {{ quiet_start <= now_time <= quiet_end }}
    {% else %}
      {{ now_time >= quiet_start or now_time <= quiet_end }}
    {% endif %}

trigger:
  # Print completion/failure triggers - different durations for different states
  - platform: state
    entity_id: !input print_status_entity
    to:
      - "finish"
      - "failed"
    not_from:
      - "unavailable"
      - "unknown"
      - "finish"
      - "failed"
    for:
      seconds: 15
    id: print_status_change
  
  # Offline trigger - require MUCH longer stability to avoid connectivity spam
  - platform: state
    entity_id: !input print_status_entity
    to: "offline"
    for:
      minutes: 5
    id: printer_offline
  
  # Print start trigger - quick notification when print begins
  - platform: state
    entity_id: !input current_stage_entity
    to: "printing"
    not_from:
      - "printing"  # Don't trigger if already printing
    for:
      seconds: 15  # Increased stability time
    id: print_started
  
  # Progress triggers - tightened ranges to prevent multiple triggers
  - platform: numeric_state
    entity_id: !input print_progress_entity
    above: 24.5
    below: 26
    for:
      seconds: 30
    id: progress_25

  - platform: numeric_state
    entity_id: !input print_progress_entity
    above: 49.5
    below: 51
    for:
      seconds: 30
    id: progress_50

  - platform: numeric_state
    entity_id: !input print_progress_entity
    above: 74.5
    below: 76
    for:
      seconds: 30
    id: progress_75

  - platform: numeric_state
    entity_id: !input print_progress_entity
    above: 99.5
    below: 101
    for:
      seconds: 30
    id: progress_100

  # Persistent notification update trigger - fires on any progress change
  # The 5-second stabilization delay prevents a race condition where the progress
  # entity updates (e.g., resets to 0) BEFORE print_status changes to "finish",
  # which would cause the notification to be recreated after being cleared.
  - platform: state
    entity_id: !input print_progress_entity
    for:
      seconds: 5
    id: persistent_progress_update

  # Clear persistent notification when print ends (stage leaves printing)
  - platform: state
    entity_id: !input current_stage_entity
    from: "printing"
    id: print_stage_ended

  # Clear persistent notification when print status changes to finish
  - platform: state
    entity_id: !input print_status_entity
    to: "finish"
    not_from:
      - "unavailable"
      - "unknown"
      - "finish"
    id: print_finished_clear_persistent

  # Print paused - detect via print_status going to pause (catches ALL pause scenarios)
  - platform: state
    entity_id: !input print_status_entity
    from: "running"
    to: "pause"
    for:
      seconds: 10
    id: print_paused

  # Print resumed - detect via print_status returning to running from pause
  - platform: state
    entity_id: !input print_status_entity
    from: "pause"
    to: "running"
    for:
      seconds: 10
    id: print_resumed

  # Printer error pause - covers all error states that pause the print
  # These fire faster (5s) than the general print_paused trigger (10s)
  # so users get specific error messages promptly
  - platform: state
    entity_id: !input current_stage_entity
    to:
      - "paused_filament_runout"
      - "paused_ams_lost"
      - "paused_nozzle_clog"
      - "paused_nozzle_temperature_malfunction"
      - "paused_heat_bed_temperature_malfunction"
      - "paused_skipped_step"
      - "paused_front_cover_falling"
      - "paused_low_fan_speed_heat_break"
      - "paused_chamber_temperature_control_error"
      - "paused_nozzle_filament_covered_detected"
      - "paused_cutter_error"
      - "paused_first_layer_error"
    for:
      seconds: 5
    id: printer_error_pause

  # Clear stale persistent notifications when quiet time ends
  - platform: time
    at: !input quiet_hours_end
    id: quiet_time_ended

# Temporarily disable all conditions for debugging
# condition:

condition:
  # Don't send notifications during quiet hours unless it's important
  - condition: or
    conditions:
      - condition: template
        value_template: "{{ not is_quiet_time }}"
      # Always allow persistent notification cleanup triggers through
      - condition: trigger
        id:
          - print_stage_ended
          - print_finished_clear_persistent
          - quiet_time_ended
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ is_quiet_time }}"
          - condition: trigger
            id:
              - print_status_change
              - printer_offline
              - print_started
              - print_paused
              - printer_error_pause
          - condition: template
            value_template: "{{ trigger.to_state.state in ['finish', 'failed'] or trigger.id in ['printer_offline', 'print_started', 'print_paused', 'printer_error_pause'] }}"

action:
  
  # NUCLEAR anti-spam protection - absolutely no false positives allowed
  - condition: template
    value_template: >
      {{ trigger.id == 'quiet_time_ended' or
         (trigger.from_state is not none and
         trigger.to_state is not none and
         trigger.from_state.state != trigger.to_state.state) }}
  
  # ULTIMATE print completion/failure validation - only allow if coming from a real
  # print state. Transitions from unavailable/unknown/idle/offline/finish are
  # connectivity events, not real completions.
  - condition: template
    value_template: >
      {{ trigger.id != 'print_status_change' or
         trigger.from_state.state in ['running', 'pause'] }}
  
  - choose:
      # Print completed successfully
      - conditions:
          - condition: trigger
            id: print_status_change
          - condition: state
            entity_id: !input print_status_entity
            state: "finish"
        sequence:
          # Clear persistent notification immediately when print completes
          - if:
              - condition: template
                value_template: "{{ enable_persistent }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ notify_service != '' }}"
                then:
                  - service: "{{ notify_service }}"
                    data:
                      message: "clear_notification"
                      data:
                        tag: "bambu_persistent_progress"
                else:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    message: "clear_notification"
                    data:
                      tag: "bambu_persistent_progress"

          # Send completion notification
          - if:
              - condition: template
                value_template: "{{ notify_service != '' }}"
            then:
              - service: "{{ notify_service }}"
                data:
                  title: "🎉 Print Complete"
                  message: "{{ printer_name }} print finished successfully"
                  data:
                    entity_id: !input camera_entity
                    channel: "3d_printer"
                    importance: high
                    notification_icon: "mdi:printer-3d"
                    color: "#4CAF50"
                    actions:
                      - action: "URI"
                        title: "View Printer"
                        uri: "homeassistant://navigate{{ dashboard_path }}"
                    clickAction: "homeassistant://navigate{{ dashboard_path }}"
            else:
              - device_id: !input notify_device
                domain: mobile_app
                type: notify
                title: "🎉 Print Complete"
                message: "{{ printer_name }} print finished successfully"
                data:
                  entity_id: !input camera_entity
                  channel: "3d_printer"
                  importance: high
                  actions:
                    - action: "URI"
                      title: "View Printer"
                      uri: "homeassistant://navigate{{ dashboard_path }}"
                  clickAction: "homeassistant://navigate{{ dashboard_path }}"

      # Print failed
      - conditions:
          - condition: trigger
            id:
              - print_status_change
          - condition: template
            value_template: "{{ trigger.to_state.state == 'failed' }}"
        sequence:
          # Clear persistent notification if enabled
          - if:
              - condition: template
                value_template: "{{ enable_persistent }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ notify_service != '' }}"
                then:
                  - service: "{{ notify_service }}"
                    data:
                      message: "clear_notification"
                      data:
                        tag: "bambu_persistent_progress"
                else:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    message: "clear_notification"
                    data:
                      tag: "bambu_persistent_progress"

          # Send failure notification
          - if:
              - condition: template
                value_template: "{{ notify_service != '' }}"
            then:
              - service: "{{ notify_service }}"
                data:
                  title: "❌ Print Failed"
                  message: "{{ printer_name }} print failed - {{ trigger.to_state.state }}"
                  data:
                    entity_id: !input camera_entity
                    channel: "3d_printer_alerts"
                    importance: max
                    notification_icon: "mdi:printer-3d-off"
                    color: "#F44336"
                    actions:
                      - action: "URI"
                        title: "View Printer"
                        uri: "homeassistant://navigate{{ dashboard_path }}"
                    clickAction: "homeassistant://navigate{{ dashboard_path }}"
            else:
              - device_id: !input notify_device
                domain: mobile_app
                type: notify
                title: "❌ Print Failed"
                message: "{{ printer_name }} print failed - {{ trigger.to_state.state }}"
                data:
                  entity_id: !input camera_entity
                  channel: "3d_printer_alerts"
                  importance: max
                  actions:
                    - action: "URI"
                      title: "View Printer"
                      uri: "homeassistant://navigate{{ dashboard_path }}"
                  clickAction: "homeassistant://navigate{{ dashboard_path }}"

      # Print started
      - conditions:
          - condition: trigger
            id: print_started
          # Check if start notifications are enabled
          - condition: template
            value_template: "{{ enable_start_notification }}"
          # Additional validation to prevent duplicate notifications
          - condition: template
            value_template: >
              {{ states(print_progress) | int < 5 }}
          - condition: template
            value_template: >
              {{ states(print_status) == 'running' }}
          # Ensure we're transitioning FROM a non-printing state
          - condition: template
            value_template: >
              {{ trigger.from_state.state != 'printing' }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ notify_service != '' }}"
            then:
              - service: "{{ notify_service }}"
                data:
                  title: "🚀 Print Started"
                  message: >
                    {{ printer_name }} started printing.

                    📄 {{ print_name }}
                    🌡️ Bed: {{ states(bed_target_temperature) | default('unknown') }}°C
                  data:
                    entity_id: !input camera_entity
                    channel: "3d_printer"
                    notification_icon: "mdi:printer-3d"
                    color: "#2196F3"
                    actions:
                      - action: "URI"
                        title: "View Printer"
                        uri: "homeassistant://navigate{{ dashboard_path }}"
                    clickAction: "homeassistant://navigate{{ dashboard_path }}"
            else:
              - device_id: !input notify_device
                domain: mobile_app
                type: notify
                title: "🚀 Print Started"
                message: >
                  {{ printer_name }} started printing.

                  📄 {{ print_name }}
                  🌡️ Bed: {{ states(bed_target_temperature) | default('unknown') }}°C
                data:
                  entity_id: !input camera_entity
                  channel: "3d_printer"
                  actions:
                    - action: "URI"
                      title: "View Printer"
                      uri: "homeassistant://navigate{{ dashboard_path }}"
                  clickAction: "homeassistant://navigate{{ dashboard_path }}"

      # Progress updates (25%, 50%, 75%) - only if persistent notifications are disabled
      - conditions:
          - condition: template
            value_template: "{{ enable_progress }}"
          - condition: template
            value_template: "{{ not enable_persistent }}"
          - condition: trigger
            id:
              - progress_25
              - progress_50
              - progress_75
          # Ensure we're actually printing
          - condition: state
            entity_id: !input current_stage_entity
            state: "printing"
          # Additional check to ensure we haven't already sent this progress notification
          - condition: template
            value_template: >
              {% set progress = states(print_progress) | int %}
              {% set trigger_progress = trigger.id.split('_')[1] | int %}
              {{ progress >= trigger_progress and progress < trigger_progress + 2 }}
        sequence:
          - variables:
              progress_percent: "{{ trigger.id.split('_')[1] }}"

          - if:
              - condition: template
                value_template: "{{ notify_service != '' }}"
            then:
              - service: "{{ notify_service }}"
                data:
                  title: "📈 Print Progress: {{ progress_percent }}%"
                  message: >
                    {{ printer_name }} is {{ progress_percent }}% complete.

                    📄 {{ print_name }}
                    ⏱️ {{ remaining_time_formatted }} · Done ~{{ finish_time }}
                    🌡️ Bed: {{ states(bed_temperature) | default('unknown') }}°C · {{ nozzle_temps }}

                    {% if include_live_view %}📹 [View Live Progress]({{ live_view_url }}){% endif %}
                  data:
                    entity_id: !input camera_entity
                    channel: "3d_printer_progress"
                    notification_icon: "mdi:printer-3d"
            else:
              - device_id: !input notify_device
                domain: mobile_app
                type: notify
                title: "📈 Print Progress: {{ progress_percent }}%"
                message: >
                  {{ printer_name }} is {{ progress_percent }}% complete.

                  📄 {{ print_name }}
                  ⏱️ {{ remaining_time_formatted }} · Done ~{{ finish_time }}
                  🌡️ Bed: {{ states(bed_temperature) | default('unknown') }}°C · {{ nozzle_temps }}
                data:
                  entity_id: !input camera_entity
                  channel: "3d_printer_progress"

      # 100% completion notification - only if persistent notifications are disabled
      - conditions:
          - condition: template
            value_template: "{{ enable_progress }}"
          - condition: template
            value_template: "{{ not enable_persistent }}"
          - condition: trigger
            id: progress_100
          # Ensure we're actually printing (not a stale state after reconnect)
          - condition: template
            value_template: "{{ states(print_status) in ['running', 'pause'] }}"
          - condition: template
            value_template: "{{ states(current_stage) in ['printing', 'finish'] }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ notify_service != '' }}"
            then:
              - service: "{{ notify_service }}"
                data:
                  title: "🎉 Print Complete!"
                  message: >
                    {{ printer_name }} has finished printing!

                    📄 {{ print_name }}
                    🌡️ Bed: {{ states(bed_temperature) | default('unknown') }}°C · {{ nozzle_temps }}

                    {% if include_live_view %}📹 [View Result]({{ live_view_url }}){% endif %}
                  data:
                    entity_id: !input camera_entity
                    channel: "3d_printer_progress"
                    importance: high
                    notification_icon: "mdi:printer-3d-nozzle"
                    color: "#4CAF50"
            else:
              - device_id: !input notify_device
                domain: mobile_app
                type: notify
                title: "🎉 Print Complete!"
                message: >
                  {{ printer_name }} has finished printing!

                  📄 {{ print_name }}
                  🌡️ Bed: {{ states(bed_temperature) }}°C · {{ nozzle_temps }}
                data:
                  entity_id: !input camera_entity
                  channel: "3d_printer_progress"
                  importance: high

      # Printer error pause - specific error detected via current_stage
      # This fires faster (5s) than the general print_paused (10s) for known errors
      - conditions:
          - condition: trigger
            id: printer_error_pause
          # Only gate AMS-lost behind enable_ams_alerts; all other errors always notify
          - condition: template
            value_template: >
              {{ trigger.to_state.state != 'paused_ams_lost' or enable_ams_alerts }}
        sequence:
          # Clear persistent notification if enabled
          - if:
              - condition: template
                value_template: "{{ enable_persistent }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ notify_service != '' }}"
                then:
                  - service: "{{ notify_service }}"
                    data:
                      message: "clear_notification"
                      data:
                        tag: "bambu_persistent_progress"
                else:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    message: "clear_notification"
                    data:
                      tag: "bambu_persistent_progress"

          # Build error-specific notification
          - variables:
              error_stage: "{{ trigger.to_state.state }}"
              alert_title: >
                {% if error_stage == 'paused_filament_runout' %}
                  🚨 Filament Runout!
                {% elif error_stage == 'paused_nozzle_clog' %}
                  🚨 Nozzle Clog Detected!
                {% elif error_stage == 'paused_ams_lost' %}
                  🚨 AMS Connection Lost!
                {% elif error_stage == 'paused_nozzle_temperature_malfunction' %}
                  🚨 Nozzle Temperature Error!
                {% elif error_stage == 'paused_heat_bed_temperature_malfunction' %}
                  🚨 Bed Temperature Error!
                {% elif error_stage == 'paused_skipped_step' %}
                  🚨 Motor Step Loss Detected!
                {% elif error_stage == 'paused_front_cover_falling' %}
                  🚨 Front Cover Fell Off!
                {% elif error_stage == 'paused_low_fan_speed_heat_break' %}
                  🚨 Heatbreak Fan Speed Low!
                {% elif error_stage == 'paused_chamber_temperature_control_error' %}
                  🚨 Chamber Temperature Error!
                {% elif error_stage == 'paused_nozzle_filament_covered_detected' %}
                  🚨 Nozzle Filament Buildup!
                {% elif error_stage == 'paused_cutter_error' %}
                  🚨 Filament Cutter Error!
                {% elif error_stage == 'paused_first_layer_error' %}
                  🚨 First Layer Error!
                {% else %}
                  🚨 Printer Error!
                {% endif %}
              alert_message: >
                {% if error_stage == 'paused_filament_runout' %}
                  {{ printer_name }} has run out of filament!
                {% elif error_stage == 'paused_nozzle_clog' %}
                  {{ printer_name }} detected a nozzle clog!
                {% elif error_stage == 'paused_ams_lost' %}
                  {{ printer_name }} lost connection to the AMS!
                {% elif error_stage == 'paused_nozzle_temperature_malfunction' %}
                  {{ printer_name }} nozzle temperature malfunction!
                {% elif error_stage == 'paused_heat_bed_temperature_malfunction' %}
                  {{ printer_name }} heat bed temperature malfunction!
                {% elif error_stage == 'paused_skipped_step' %}
                  {{ printer_name }} detected motor step loss!
                {% elif error_stage == 'paused_front_cover_falling' %}
                  {{ printer_name }} front cover has fallen off!
                {% elif error_stage == 'paused_low_fan_speed_heat_break' %}
                  {{ printer_name }} heatbreak fan speed is too low!
                {% elif error_stage == 'paused_chamber_temperature_control_error' %}
                  {{ printer_name }} chamber temperature control error!
                {% elif error_stage == 'paused_nozzle_filament_covered_detected' %}
                  {{ printer_name }} detected filament buildup on nozzle!
                {% elif error_stage == 'paused_cutter_error' %}
                  {{ printer_name }} filament cutter error!
                {% elif error_stage == 'paused_first_layer_error' %}
                  {{ printer_name }} detected a first layer error!
                {% else %}
                  {{ printer_name }} needs attention.
                {% endif %}
              alert_action: >
                {% if error_stage == 'paused_filament_runout' %}
                  ⚠️ Load new filament to continue printing.
                {% elif error_stage == 'paused_nozzle_clog' %}
                  ⚠️ Clear the nozzle clog to continue.
                {% elif error_stage == 'paused_ams_lost' %}
                  ⚠️ Check AMS connection and power.
                {% elif error_stage == 'paused_front_cover_falling' %}
                  ⚠️ Reattach the front cover.
                {% elif error_stage == 'paused_first_layer_error' %}
                  ⚠️ Check the first layer and bed adhesion.
                {% elif error_stage == 'paused_cutter_error' %}
                  ⚠️ Check the filament cutter.
                {% else %}
                  ⚠️ Check the printer.
                {% endif %}
          - if:
              - condition: template
                value_template: "{{ notify_service != '' }}"
            then:
              - service: "{{ notify_service }}"
                data:
                  title: "{{ alert_title }}"
                  message: >
                    {{ alert_message }}

                    📄 {{ print_name }}
                    📊 {{ states(print_progress) | default(0) }}% complete

                    {{ alert_action }}

                    {% if include_live_view %}📹 [View Camera]({{ live_view_url }}){% endif %}
                  data:
                    entity_id: !input camera_entity
                    channel: "3d_printer_alerts"
                    importance: max
                    notification_icon: "mdi:printer-3d-nozzle-alert"
                    color: "#FF5722"
                    actions:
                      - action: "URI"
                        title: "View Printer"
                        uri: "homeassistant://navigate{{ dashboard_path }}"
                    clickAction: "homeassistant://navigate{{ dashboard_path }}"
            else:
              - device_id: !input notify_device
                domain: mobile_app
                type: notify
                title: "{{ alert_title }}"
                message: >
                  {{ alert_message }}

                  📄 {{ print_name }}
                  📊 {{ states(print_progress) | default(0) }}% complete

                  {{ alert_action }}
                data:
                  entity_id: !input camera_entity
                  channel: "3d_printer_alerts"
                  importance: max
                  actions:
                    - action: "URI"
                      title: "View Printer"
                      uri: "homeassistant://navigate{{ dashboard_path }}"
                  clickAction: "homeassistant://navigate{{ dashboard_path }}"

      # Print paused (general) - catches pauses not covered by specific error triggers
      # Skips if current_stage is a known error (already handled by printer_error_pause above)
      - conditions:
          - condition: trigger
            id: print_paused
          # Skip if this is a known error pause (the printer_error_pause handler already sent a notification)
          - condition: template
            value_template: >
              {{ states(current_stage) not in [
                'paused_filament_runout', 'paused_ams_lost', 'paused_nozzle_clog',
                'paused_nozzle_temperature_malfunction', 'paused_heat_bed_temperature_malfunction',
                'paused_skipped_step', 'paused_front_cover_falling',
                'paused_low_fan_speed_heat_break', 'paused_chamber_temperature_control_error',
                'paused_nozzle_filament_covered_detected', 'paused_cutter_error',
                'paused_first_layer_error'
              ] }}
        sequence:
          # Clear persistent notification if enabled
          - if:
              - condition: template
                value_template: "{{ enable_persistent }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ notify_service != '' }}"
                then:
                  - service: "{{ notify_service }}"
                    data:
                      message: "clear_notification"
                      data:
                        tag: "bambu_persistent_progress"
                else:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    message: "clear_notification"
                    data:
                      tag: "bambu_persistent_progress"

          # Determine if this is a user pause or unknown error
          - variables:
              is_user_pause: >
                {{ states(current_stage) in ['paused_user', 'm400_pause', 'paused_user_gcode'] }}
              pause_title: >
                {% if is_user_pause %}⏸️ Print Paused{% else %}⚠️ Print Paused{% endif %}
              pause_message: >
                {% if is_user_pause %}
                  {{ printer_name }} print has been paused.
                {% else %}
                  {{ printer_name }} print has paused unexpectedly. Check the printer for issues.
                {% endif %}

          - if:
              - condition: template
                value_template: "{{ notify_service != '' }}"
            then:
              - service: "{{ notify_service }}"
                data:
                  title: "{{ pause_title }}"
                  message: >
                    {{ pause_message }}

                    📄 {{ print_name }}
                    📊 {{ states(print_progress) | default(0) }}% complete

                    {% if include_live_view %}📹 [View Live Camera]({{ live_view_url }}){% endif %}
                  data:
                    entity_id: !input camera_entity
                    channel: "{% if is_user_pause %}3d_printer{% else %}3d_printer_alerts{% endif %}"
                    importance: "{% if is_user_pause %}default{% else %}high{% endif %}"
                    notification_icon: "{% if is_user_pause %}mdi:pause{% else %}mdi:printer-3d-nozzle-alert{% endif %}"
                    color: "{% if is_user_pause %}#FF9800{% else %}#FF5722{% endif %}"
                    actions:
                      - action: "URI"
                        title: "View Printer"
                        uri: "homeassistant://navigate{{ dashboard_path }}"
                    clickAction: "homeassistant://navigate{{ dashboard_path }}"
            else:
              - device_id: !input notify_device
                domain: mobile_app
                type: notify
                title: "{{ pause_title }}"
                message: >
                  {{ pause_message }}

                  📄 {{ print_name }}
                  📊 {{ states(print_progress) | default(0) }}% complete
                data:
                  entity_id: !input camera_entity
                  channel: "{% if is_user_pause %}3d_printer{% else %}3d_printer_alerts{% endif %}"
                  importance: "{% if is_user_pause %}default{% else %}high{% endif %}"
                  actions:
                    - action: "URI"
                      title: "View Printer"
                      uri: "homeassistant://navigate{{ dashboard_path }}"
                  clickAction: "homeassistant://navigate{{ dashboard_path }}"

      # Print resumed
      - conditions:
          - condition: trigger
            id: print_resumed
        sequence:
          - if:
              - condition: template
                value_template: "{{ notify_service != '' }}"
            then:
              - service: "{{ notify_service }}"
                data:
                  title: "▶️ Print Resumed"
                  message: >
                    {{ printer_name }} print has been resumed.

                    📄 {{ print_name }}
                    📊 {{ states(print_progress) | default(0) }}% complete
                    ⏱️ {{ remaining_time_formatted }} · Done ~{{ finish_time }}

                    {% if include_live_view %}📹 [Watch Live Progress]({{ live_view_url }}){% endif %}
                  data:
                    entity_id: !input camera_entity
                    channel: "3d_printer"
                    notification_icon: "mdi:play"
                    color: "#4CAF50"
            else:
              - device_id: !input notify_device
                domain: mobile_app
                type: notify
                title: "▶️ Print Resumed"
                message: >
                  {{ printer_name }} print has been resumed.

                  📄 {{ print_name }}
                  📊 {{ states(print_progress) | default(0) }}% complete
                  ⏱️ {{ remaining_time_formatted }} · Done ~{{ finish_time }}
                data:
                  entity_id: !input camera_entity
                  channel: "3d_printer"

      # Persistent progress notification - updates throughout the print or clears when done
      - conditions:
          - condition: template
            value_template: "{{ enable_persistent }}"
          - condition: trigger
            id: persistent_progress_update
        sequence:
          - if:
              - condition: template
                value_template: "{{ states(print_status) == 'running' }}"
              - condition: template
                value_template: "{{ states(current_stage) == 'printing' }}"
              - condition: template
                value_template: "{{ states(print_progress) | int >= 0 and states(print_progress) | int < 100 }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ notify_service != '' }}"
                then:
                  - service: "{{ notify_service }}"
                    data:
                      title: "🖨️ {{ printer_name }} Printing"
                      message: >
                        {{ states(print_progress) | int }}% Complete

                        📄 {{ print_name }}
                        ⏱️ {{ remaining_time_formatted }} · Done ~{{ finish_time }}
                        🌡️ Bed: {{ states(bed_temperature) }}°C · {{ nozzle_temps }}
                      data:
                        tag: "bambu_persistent_progress"
                        channel: "3d_printer_persistent"
                        importance: low
                        notification_icon: "mdi:printer-3d"
                        color: "#2196F3"
                        sticky: true
                        timeout: 600
                        progress: "{{ states(print_progress) | int }}"
                        progress_max: 100
                        actions:
                          - action: "URI"
                            title: "View Printer"
                            uri: "homeassistant://navigate{{ dashboard_path }}"
                        clickAction: "homeassistant://navigate{{ dashboard_path }}"
                else:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "🖨️ {{ printer_name }} Printing"
                    message: >
                      {{ states(print_progress) | int }}% Complete

                      📄 {{ print_name }}
                      ⏱️ {{ remaining_time_formatted }} · Done ~{{ finish_time }}
                      🌡️ Bed: {{ states(bed_temperature) }}°C · {{ nozzle_temps }}
                    data:
                      tag: "bambu_persistent_progress"
                      channel: "3d_printer_persistent"
                      importance: low
                      sticky: true
                      timeout: 600
                      progress: "{{ states(print_progress) | int }}"
                      progress_max: 100
                      actions:
                        - action: "URI"
                          title: "View Printer"
                          uri: "homeassistant://navigate{{ dashboard_path }}"
                      clickAction: "homeassistant://navigate{{ dashboard_path }}"
            else:
              # Print no longer actively running - clear the persistent notification
              - if:
                  - condition: template
                    value_template: "{{ notify_service != '' }}"
                then:
                  - service: "{{ notify_service }}"
                    data:
                      message: "clear_notification"
                      data:
                        tag: "bambu_persistent_progress"
                else:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    message: "clear_notification"
                    data:
                      tag: "bambu_persistent_progress"

      # Clear persistent notification when print stage ends or print finishes (immediate, no delay)
      - conditions:
          - condition: template
            value_template: "{{ enable_persistent }}"
          - condition: trigger
            id:
              - print_stage_ended
              - print_finished_clear_persistent
        sequence:
          # First clear attempt
          - if:
              - condition: template
                value_template: "{{ notify_service != '' }}"
            then:
              - service: "{{ notify_service }}"
                data:
                  message: "clear_notification"
                  data:
                    tag: "bambu_persistent_progress"
            else:
              - device_id: !input notify_device
                domain: mobile_app
                type: notify
                message: "clear_notification"
                data:
                  tag: "bambu_persistent_progress"
          # Retry after 5 seconds - phones in Doze mode or with aggressive
          # battery optimization may not process the first clear command
          - delay:
              seconds: 5
          - if:
              - condition: template
                value_template: "{{ notify_service != '' }}"
            then:
              - service: "{{ notify_service }}"
                data:
                  message: "clear_notification"
                  data:
                    tag: "bambu_persistent_progress"
            else:
              - device_id: !input notify_device
                domain: mobile_app
                type: notify
                message: "clear_notification"
                data:
                  tag: "bambu_persistent_progress"

      # Clear stale persistent notification when quiet time ends (in case phone missed the clear during quiet hours)
      - conditions:
          - condition: template
            value_template: "{{ enable_persistent }}"
          - condition: trigger
            id: quiet_time_ended
          - condition: template
            value_template: "{{ states(print_status) != 'running' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ notify_service != '' }}"
            then:
              - service: "{{ notify_service }}"
                data:
                  message: "clear_notification"
                  data:
                    tag: "bambu_persistent_progress"
            else:
              - device_id: !input notify_device
                domain: mobile_app
                type: notify
                message: "clear_notification"
                data:
                  tag: "bambu_persistent_progress"

      # Printer went offline - separate trigger with long delay
      - conditions:
          - condition: trigger
            id: printer_offline
        sequence:
          - if:
              - condition: template
                value_template: "{{ notify_service != '' }}"
            then:
              - service: "{{ notify_service }}"
                data:
                  title: "🔌 Printer Offline"
                  message: "Printer lost connection - check power and network"
                  data:
                    channel: "3d_printer_alerts"
                    importance: high
                    notification_icon: "mdi:printer-off"
                    color: "#FF9800"
                    actions:
                      - action: "VIEW_PRINTER"
                        title: "View Printer"
                    clickAction: "homeassistant://navigate{{ dashboard_path }}"
            else:
              - device_id: !input notify_device
                domain: mobile_app
                type: notify
                title: "🔌 Printer Offline"
                message: >
                  {{ printer_name }} has gone offline. 
                  Check power connection and network connectivity.
                data:
                  channel: "3d_printer_alerts"
                  importance: high

  # Log automation triggers for debugging
  - service: logbook.log
    data:
      name: "Bambu Lab Printer Monitor"
      message: "Automation triggered for {{ printer_name }}: {{ trigger.id }}"
      entity_id: !input print_status_entity